name: CPU regression checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'setuptools<81'
      - run: python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/engine.txt
      - run: python -m pip install -e '.[test]'
      - run: distill-tool bootstrap --engine vendor/yolov5
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
